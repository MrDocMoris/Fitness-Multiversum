<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="mobile-web-app-capable" content="yes">
<title>Fitness-Multiversum – Ernährung & Aktivität</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="capacitor.js" onerror="this.remove()"></script>
<script src="zxing.js" onerror="this.remove()"></script>
<style>
:root{
  --bg:#0b0a1a; --panel:#15122c; --panel2:#201c3f; --line:#2f2a58; --text:#efecff; --mute:#9c95c8;
  --grad:linear-gradient(120deg,#6fe3ff 0%,#a78bff 55%,#e59bff 100%); --glow:0 0 18px rgba(130,110,255,.45);
  --acc:#7fe3ff; --ok:#3fd68a; --bad:#ff5c6c; --warn:#ffb13d;
  --cp:#66e0ff; --cc:#ffcf6b; --cf:#ff5ec8;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Space Grotesk",system-ui,sans-serif}
body{background:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(98,70,230,.35),transparent 60%),radial-gradient(ellipse 80% 50% at 100% 100%,rgba(70,200,255,.10),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 34% 72%,#cfc6ff,transparent),radial-gradient(1px 1px at 88% 64%,#fff,transparent),radial-gradient(1px 1px at 55% 38%,#bfefff,transparent),radial-gradient(1.5px 1.5px at 6% 88%,#fff,transparent),radial-gradient(1px 1px at 66% 90%,#fff,transparent),radial-gradient(1px 1px at 22% 46%,#fff,transparent),radial-gradient(1px 1px at 93% 32%,#e3d9ff,transparent),radial-gradient(1px 1px at 44% 8%,#fff,transparent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;flex-direction:column;height:100%}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto}
.view.on{display:block}
.pad{padding:calc(14px + var(--safe-t)) 14px 100px}
nav{display:flex;background:rgba(17,14,38,.92);backdrop-filter:blur(10px);border-top:1px solid transparent;border-image:var(--grad) 1;padding-bottom:var(--safe-b);position:relative;z-index:5}
nav button{flex:1;min-width:0;padding:10px 0 8px;color:var(--mute);font-size:11px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc);text-shadow:0 0 12px rgba(127,227,255,.6)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(127,227,255,.7))}
h1{font-size:24px;margin:0;background:linear-gradient(90deg,#ffffff,#c9bcff 60%,#8fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:18px 0 8px;font-weight:500}
.muted{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:18px 10px;font-size:14px}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.hlogo{width:62px;height:62px;border-radius:17px;box-shadow:0 0 24px rgba(130,110,255,.55),0 0 0 1px rgba(167,139,255,.5);animation:hfloat 5s ease-in-out infinite;flex:none}
@keyframes hfloat{50%{transform:translateY(-4px) rotate(-2deg)}}
.hero .sub{color:var(--mute);font-size:13px;margin-top:2px}
.gearbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);color:var(--acc);box-shadow:var(--glow);flex:none}
.gearbtn svg{width:22px;height:22px;transition:transform .5s}
.gearbtn:active svg{transform:rotate(90deg)}
.hstats{display:flex;gap:8px;margin-bottom:12px}
.hstats div{flex:1;min-width:0;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.hstats b{display:block;font-size:19px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats span{font-size:11px;color:var(--mute)}
.card{border-radius:18px;background:linear-gradient(160deg,rgba(40,33,84,.9),rgba(22,18,46,.9));border:1px solid var(--line);padding:12px;position:relative;overflow:hidden;margin-bottom:12px}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(rgba(167,139,255,.22),transparent 70%);pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(22,24,31,.6);border:1px solid var(--line);flex:none}
.iconbtn svg{width:19px;height:19px}
.chip{padding:7px 12px;border-radius:99px;background:rgba(22,24,31,.85);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--grad);color:#0b0a1a;border-color:transparent;box-shadow:var(--glow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hints{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.hint{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:12px;background:rgba(27,23,56,.82);border:1px solid var(--line);font-size:14px;width:100%}
.hint.warn{border-color:rgba(255,177,61,.5);background:rgba(255,177,61,.10)}
.hint.bad{border-color:rgba(255,92,108,.5);background:rgba(255,92,108,.10)}
.hint.good{border-color:rgba(63,214,138,.5);background:rgba(63,214,138,.10)}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dnav .t{flex:1;text-align:center;font-weight:700;font-size:17px}
/* Kalorien-Ring */
.ringwrap{display:flex;align-items:center;gap:12px}
.ring{width:150px;height:150px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-size:30px;line-height:1.05;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring .c b.over{background:none;color:var(--bad)}
.ring .c span{font-size:11px;color:var(--mute)}
.rside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.rside div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;color:var(--mute)}
.rside b{color:var(--text);font-size:16px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.macro span{display:block;font-size:12px;color:var(--mute)}
.macro b{font-size:14px}
.macro small{color:var(--mute);font-size:11px}
.prog{height:7px;border-radius:7px;background:var(--panel2);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;border-radius:7px;background:var(--grad)}
.prog i.over{background:linear-gradient(90deg,#ff8a8a,#ff5c6c)}
/* Wasser */
.water{display:flex;align-items:center;gap:10px}
.water .gl{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.water .gl button{width:26px;height:32px;border-radius:4px 4px 8px 8px;border:2px solid #4b7fbf;position:relative;overflow:hidden}
.water .gl button.on{background:linear-gradient(#7fe3ff,#3e8cff);border-color:#7fe3ff;box-shadow:0 0 8px rgba(127,227,255,.5)}
/* Mahlzeiten */
.meal{border-radius:16px;background:rgba(27,23,56,.82);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px}
.mh .mi{font-size:24px;width:34px;text-align:center;flex:none}
.mh .mt{flex:1;min-width:0}
.mh .mt b{display:block}
.mh .mt small{color:var(--mute);font-size:12px}
.mh .add{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#0b0a1a;display:grid;place-items:center;box-shadow:var(--glow);flex:none}
.mh .add svg{width:22px;height:22px}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-top:1px solid rgba(47,42,88,.6)}
.it .n{flex:1;min-width:0}
.it .n b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .n small{color:var(--mute);font-size:12px}
.it .k{font-weight:700;font-size:14px;flex:none}
.mfoot{padding:6px 12px 10px;display:flex;gap:6px;flex-wrap:wrap}
/* Listen */
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px}
.row:active{transform:scale(.985)}
.row .ic{font-size:22px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{text-align:right;flex:none;font-size:13px}
.row .rt b{display:block;font-size:15px}
.row .rt small{color:var(--mute);font-size:11px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;vertical-align:1px;background:var(--panel2);color:var(--acc);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv.three{grid-template-columns:1fr 1fr 1fr}
.kv div{background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--mute)}
.kv b{font-size:16px}
.big{font-size:38px;font-weight:700;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Diagramme */
.chart{width:100%;height:170px;display:block}
.chart .ln{fill:none;stroke:url(#cg);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#ca);opacity:.5}
.chart text{fill:var(--mute);font-size:10px;font-family:inherit}
.chart .goal{stroke:var(--ok);stroke-dasharray:5 4;stroke-width:1.4}
.chart .grid{stroke:rgba(156,149,200,.15);stroke-width:1}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;margin:8px 0 4px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%;min-width:0}
.bars .b i{display:block;width:70%;border-radius:4px 4px 0 0;min-height:2px;background:linear-gradient(#e59bff,#a78bff)}
.bars .b i.over{background:linear-gradient(#ff8a8a,#ff5c6c)}
.bars .b i.ok{background:linear-gradient(#8ff0b8,#3fd68a)}
.bars .b small{font-size:9px;color:var(--mute);white-space:nowrap}
.bars .b.cur small{color:var(--acc);font-weight:700}
.bars .gl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ok);pointer-events:none}
.donut{display:flex;gap:14px;align-items:center}
.donut svg{width:120px;height:120px;flex:none}
.leg{flex:1;min-width:0;font-size:13px}
.leg div{display:flex;align-items:center;gap:6px;margin:4px 0}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{flex:1}
/* FAB, Sheet, Formulare */
#fab{position:fixed;right:18px;bottom:calc(74px + var(--safe-b));width:62px;height:62px;border-radius:50%;background:var(--grad);color:#0b0a1a;box-shadow:0 0 0 3px rgba(167,139,255,.35),0 0 26px rgba(127,227,255,.55);display:grid;place-items:center;z-index:10;transition:transform .1s}
#fab:active{transform:scale(.92)}
#fab svg{width:30px;height:30px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .25s ease;z-index:20;overflow-y:auto;padding:8px 16px calc(18px + var(--safe-b))}
#sheet.on{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none}
#scrim.on{display:block}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:2px auto 12px}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:#7a6cff}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.wrap button{flex:1 1 30%;white-space:normal;line-height:1.2}
.seg button.on{background:var(--grad);color:#0b0a1a;border-color:transparent;font-weight:700}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 2px}
.tog{width:46px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.tog.on{background:rgba(127,227,255,.25);border-color:var(--acc)}
.tog.on::after{transform:translateX(20px);background:var(--acc)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:110px;padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-weight:500;text-align:center;text-decoration:none;color:var(--text)}
.btn.pri{background:var(--grad);color:#0b0a1a;border-color:transparent;font-weight:700;box-shadow:var(--glow)}
.btn.del{color:var(--bad);border-color:rgba(255,92,108,.4)}
.btn:disabled{opacity:.5}
.set-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sbox{display:flex;gap:8px;margin-bottom:10px;position:sticky;top:-8px;z-index:2;padding:8px 0 4px;background:var(--panel)}
.sbox input{flex:1;font-size:16px;padding:12px 13px;border-radius:12px;width:100%;background:var(--panel2);border:1px solid var(--line);outline:none}
.sbox button{width:48px;border-radius:12px;background:var(--grad);color:#0b0a1a;display:grid;place-items:center;box-shadow:var(--glow);flex:none;font-size:22px}
.amtin{width:100%;font-size:34px;font-weight:700;text-align:center;padding:8px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);outline:none;color:var(--text)}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px;text-align:center}
.nutri div{background:var(--panel2);border-radius:10px;padding:8px 2px;border:1px solid var(--line)}
.nutri b{display:block;font-size:17px}
.nutri span{font-size:11px;color:var(--mute)}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:10px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .ln{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff5c6c;box-shadow:0 0 12px #ff5c6c;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{50%{transform:translateY(-60px)}}
.pbar{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;background:var(--grad);transition:width .2s}
#toast{position:fixed;z-index:50;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-150%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:99px;transition:transform .25s;font-size:14px;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
.cp{color:var(--cp)} .cc{color:var(--cc)} .cf{color:var(--cf)} .red{color:var(--bad)} .grn{color:var(--ok)}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.icons button{padding:8px 2px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.icons button span{font-size:22px}.icons button small{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icons button.on{border-color:var(--acc);box-shadow:var(--glow)}
.streaks{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.streaks span{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:linear-gradient(120deg,rgba(255,177,61,.18),rgba(255,94,200,.18));border:1px solid rgba(255,177,61,.4)}
details.more summary{cursor:pointer;color:var(--mute);font-size:12px;margin-top:12px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{color:var(--acc)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{text-align:center;padding:10px 6px;border-radius:14px;background:rgba(27,23,56,.82);border:1px solid var(--line);min-width:0}
.badge.off{opacity:.38;filter:grayscale(1)}
.badge i{font-size:28px;font-style:normal;display:block}
.badge b{font-size:12px;display:block;margin-top:2px}
.badge small{font-size:10px;color:var(--mute);display:block;line-height:1.25}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);position:relative;padding:0}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);font-size:10px;padding:3px 2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center}.cmp img{width:100%;border-radius:12px;aspect-ratio:3/4;object-fit:cover}
.ri{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ri .n{flex:1;min-width:0}.ri .n b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ri .n small{color:var(--mute);font-size:12px}
.ri input{width:76px;text-align:right;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;outline:none}
.card.ch{background:linear-gradient(150deg,rgba(111,227,255,.16),rgba(229,155,255,.16));border-color:rgba(167,139,255,.45)}
input[type=datetime-local]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;color-scheme:dark}
</style>
</head>
<body>
<div class="app" id="app"><main>
<section class="view on" id="v-home"><div class="pad">
  <div class="hero">
    <img class="hlogo" id="logo" alt="">
    <div style="flex:1;min-width:0"><h1>Fitness-Multiversum</h1><div class="sub" id="greet">Ernährung & Aktivität</div></div>

function allLocalFoods(){ const m = new Map(); BASICS.forEach(f => m.set(f.id, f)); Object.values(S.foods).forEach(f => m.set(f.id, f)); return [...m.values()]; }
function searchLocal(q){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = allLocalFoods();
  if(toks.length) list = list.filter(f => { const h = (f.name + ' ' + (f.brand || '')).toLowerCase(); return toks.every(t => h.includes(t)); });
  return list.sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || (b.uses || 0) - (a.uses || 0) || (b.last || 0) - (a.last || 0) || a.name.localeCompare(b.name));
}
const foodRow = (f, extra) => `<button class="row" data-f="${esc(f.id)}"><div class="ic">${f.fav ? '⭐' : f.recipe ? '🍲' : f.own ? '✏️' : f.code ? '🏷️' : f.basic ? '🥗' : f.src === 'yazio' ? '🍏' : '🕘'}</div><div class="mid"><b>${esc(f.name)}</b><small>${esc([f.brand, f.serving && f.serving.label && f.serving.g ? `${f.serving.label} = ${de(f.serving.g)} g` : ''].filter(Boolean).join(' · ') || (extra || ''))}</small></div><div class="rt"><b>${de(f.per100.kcal)}</b><small>kcal/100${f.unit === 'ml' ? ' ml' : ' g'}</small></div></button>`;

}

/* Open Food Facts (freie Lebensmittel-Datenbank, auch für Barcodes) */
const OFF_FIELDS = 'code,product_name,product_name_de,generic_name,brands,nutriments,serving_quantity,serving_size,quantity';
const offHeaders = () => NATIVE ? {'User-Agent':'FitnessMultiversum/1.0 (private Android-App)'} : {};
function offToFood(p){
  if(!p) return null;
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g']; if(kcal == null && n.energy_100g != null) kcal = n.energy_100g / 4.184;
  if(kcal == null) return null;
  const name = (p.product_name_de || p.product_name || p.generic_name || '').trim(); if(!name) return null;
  const sq = parseFloat(p.serving_quantity);
  return {id:'off:' + p.code, code:p.code, name, brand:String(p.brands || '').split(',')[0].trim(), per100:{kcal:+kcal || 0, p:+n.proteins_100g || 0, c:+n.carbohydrates_100g || 0, f:+n.fat_100g || 0, sugar:+n.sugars_100g || 0, fiber:+n.fiber_100g || 0, salt:+n.salt_100g || 0}, serving:sq > 0 ? {g:sq, label:p.serving_size ? String(p.serving_size).replace(/\s*\(.*\)/, '').slice(0, 24) : 'Portion'} : null, src:'off'};
}
async function offSearch(q){
  const url = `https://de.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&lc=de&fields=${OFF_FIELDS}`;
  const r = await fetch(url, {headers:offHeaders()}); if(!r.ok) throw new Error(r.status);
  const d = await r.json();
  return (d.products || []).map(offToFood).filter(Boolean);
}
async function offBarcode(code){
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`, {headers:offHeaders()});
  if(r.status === 404) return null; if(!r.ok) throw new Error(r.status);
  const d = await r.json(); return d.status === 1 || d.product ? offToFood(d.product) : null;
}

/* ================= Barcode-Scanner ================= */
function scanSheet(meal, opts){
  openSheet(`<h2>📷 Barcode scannen</h2><div class="scanbox"><video id="sc-v" playsinline muted autoplay></video><div class="ln"></div></div>
    <div class="muted" id="sc-info">Kamera wird gestartet…</div>
    <label class="f">…oder Nummer eintippen</label><div class="two"><div style="flex:2"><input type="text" inputmode="numeric" id="sc-code" placeholder="z. B. 4008400401621"></div><div><button class="btn pri" id="sc-go" style="width:100%;min-width:0">Suchen</button></div></div>`);
  let stream = null, timer = null, done = false, busy = false;
  const stop = () => { done = true; clearInterval(timer); if(stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  onSheetClose = stop;
  const found = code => { if(done) return; stop(); onSheetClose = null; try{ navigator.vibrate && navigator.vibrate(60); }catch(e){} lookupBarcode(code, meal, opts); };
  $('#sc-go').onclick = () => { const c = $('#sc-code').value.replace(/\D/g, ''); if(c.length >= 6) found(c); else toast('Bitte die Nummer unter dem Barcode eingeben'); };
  (async () => {
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
      if(done){ stream.getTracks().forEach(t => t.stop()); return; }
      const v = $('#sc-v'); v.srcObject = stream; await v.play().catch(() => {});
      let det = null;
      if('BarcodeDetector' in window){ try{ det = new BarcodeDetector({formats:['ean_13', 'ean_8', 'upc_a', 'upc_e']}); }catch(e){ det = null; } }
      let zx = null;
      if(!det && window.ZXing){ const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]); hints.set(ZXing.DecodeHintType.TRY_HARDER, true); zx = new ZXing.MultiFormatReader(); zx.setHints(hints); }
      if(!det && !zx){ $('#sc-info').textContent = 'Automatisches Erkennen geht auf diesem Gerät nicht – bitte die Nummer eintippen.'; return; }
      $('#sc-info').textContent = 'Barcode in den roten Strich halten…';
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d', {willReadFrequently:true});
      timer = setInterval(async () => {
        if(done || busy || !v.videoWidth) return; busy = true;
        try{
          if(det){ const r = await det.detect(v); if(r && r.length) found(r[0].rawValue); }
          else{ const w = v.videoWidth, h = v.videoHeight, cw = Math.min(w, 960), ch = Math.round(cw * 0.5); cv.width = cw; cv.height = ch; ctx.drawImage(v, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, cw, ch); try{ const res = zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))); if(res) found(res.getText()); }catch(e){ /* kein Code im Bild */ } }
        }catch(e){} busy = false;
      }, 280);
    }catch(e){ if(!done && $('#sc-info')) $('#sc-info').textContent = 'Kamera nicht verfügbar – bitte Kamera-Zugriff erlauben oder die Nummer eintippen.'; }
  })();
}
async function lookupBarcode(code, meal, opts){
  opts = Object.assign({}, opts, {scan:true});
  const local = Object.values(S.foods).find(f => f.code === code);
  if(local){ amountSheet(local, meal, null, opts); return; }
  openSheet(`<h2>Suche ${esc(code)}…</h2><div class="empty">⏳ Frage Open Food Facts</div>`);
  let f = null, offline = false;
  try{ f = await offBarcode(code); }catch(e){ offline = true; }
  if(f){ amountSheet(f, meal, null, opts); return; }
  openSheet(`<h2>Produkt nicht gefunden</h2><p class="muted">${offline ? 'Keine Verbindung zu Open Food Facts.' : `Der Barcode ${esc(code)} ist noch nicht in Open Food Facts.`} Leg das Produkt einmal an – danach erkennt die App es beim Scannen sofort.</p>
    <div class="btns"><button class="btn pri" id="nf-lb">📄 Etikett fotografieren</button><button class="btn" id="nf-own">✏️ Selbst eintippen</button></div>`);
  $('#nf-lb').onclick = () => labelSheet(meal, {code}, opts);
  $('#nf-own').onclick = () => ownFoodSheet(null, {code}, meal, opts);
}

/* ================= Körper / Gewicht ================= */
function lineChart(pts, opts = {}){
  if(pts.length < 2) return '<div class="empty">Für den Verlauf werden mindestens zwei Einträge gebraucht.</div>';
  const W = 340, H = 170, L = 34, R = 8, T = 10, B = 22, trend = opts.trend;
  const ys = pts.map(p => p.y).concat(opts.goal ? [opts.goal] : [], trend ? trend.map(p => p.y) : []);
  let mn = Math.min(...ys), mx = Math.max(...ys); if(mx - mn < 2){ mn -= 1; mx += 1; } const padv = (mx - mn) * 0.1; mn -= padv; mx += padv;
  const x0 = pts[0].t, x1 = pts[pts.length - 1].t || x0 + 1;
  const X = t => L + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - L - R), Y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const path = arr => arr.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const main = trend || pts, d = path(main);
  const area = `${d}L${X(main[main.length - 1].t).toFixed(1)},${H - B}L${X(main[0].t).toFixed(1)},${H - B}Z`;
  const ticks = [mn + (mx - mn) * 0.15, (mn + mx) / 2, mx - (mx - mn) * 0.15];
  const lbl = [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#6fe3ff"/><stop offset="1" stop-color="#e59bff"/></linearGradient><linearGradient id="ca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bff" stop-opacity=".6"/><stop offset="1" stop-color="#a78bff" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="2" y="${Y(v) + 3}">${de(v, opts.dec ?? 1)}</text>`).join('')}
    ${opts.goal ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(opts.goal)}" y2="${Y(opts.goal)}"/>` : ''}
    <path class="ar" d="${area}"/>${trend ? `<path d="${path(pts)}" fill="none" stroke="rgba(156,149,200,.35)" stroke-width="1"/>${pts.length <= 120 ? pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2" fill="#cfc6ff" opacity=".7"/>`).join('') : ''}` : ''}<path class="ln" d="${d}"/>
    ${lbl.map((p, i) => `<text x="${X(p.t)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${fmtShortDay(p.ds)}</text>`).join('')}</svg>`;
}

    <div class="btns"><button class="btn pri" id="w-save">Speichern</button>${entry ? '<button class="btn del" id="w-del">Löschen</button>' : ''}</div>`);
  $('#w-kg').onfocus = e => e.target.select();
  $('#w-save').onclick = () => {
    const v = num($('#w-kg').value); if(!(v > 20 && v < 400)){ toast('Bitte ein gültiges Gewicht eingeben'); return; }

/* ================= Garmin (offizielle Personal API) ================= */
const GBASE = 'https://personal.connectapi.garmin.com';
const GTOKEN = '/personalapitoken-service/personal-api/personal-api-key/token';
function jwtExp(tok){ try{ const p = JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.exp || 0; }catch(e){ return 0; } }
async function gToken(force){
  const now = Date.now() / 1000;
  if(!force && S.g.tok && S.g.tokExp - 600 > now) return S.g.tok;
  const r = await fetch(GBASE + GTOKEN, {method:'POST', headers:{Authorization:'ApiKey ' + S.g.key.trim(), Accept:'*/*'}});
  if(r.status === 401 || r.status === 403) throw new Error('Garmin lehnt den Schlüssel ab – evtl. abgelaufen oder gelöscht. Bitte neuen Schlüssel erstellen.');
  if(!r.ok) throw new Error(`Garmin antwortet nicht (Fehler ${r.status})`);
  let txt = (await r.text()).trim(), tok = txt;
  if(txt.startsWith('{')){ const j = JSON.parse(txt); tok = j.access_token || j.accessToken || j.token || ''; }
  tok = tok.replace(/^"|"$/g, ''); if(!tok) throw new Error('Garmin hat keinen Zugangs-Token geliefert');
  S.g.tok = tok; S.g.tokExp = jwtExp(tok) || now + 3600; saveG();
  return tok;
}
async function gGet(path, q){
  const u = new URL(GBASE + path); Object.entries(q || {}).forEach(([k, v]) => { if(v != null) u.searchParams.set(k, v); });
  const send = async tok => fetch(u.toString(), {headers:{Authorization:'Bearer ' + tok, Accept:'application/json'}});
  let r = await send(await gToken());
  if(r.status === 401) r = await send(await gToken(true));
  if(r.status === 204) return null;
  if(!r.ok) throw new Error(`Fehler ${r.status} bei ${path.split('/')[1]}`);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const arr = x => Array.isArray(x) ? x : x && Array.isArray(x.data) ? x.data : x && Array.isArray(x.dailySleepDTOList) ? x.dailySleepDTOList : x && Array.isArray(x.dateWeightList) ? x.dateWeightList : [];
const dig = (o, ...k) => k.reduce((v, key) => v && typeof v === 'object' ? v[key] : undefined, o);
let _gBusy = false;
async function garminSync(manual){
  if(!S.g.key || _gBusy) return;
  if(!NATIVE && !manual) return;
  _gBusy = true; if(manual) toast('⌚ Garmin wird abgeglichen…');
  const t = todayStr(), first = S.g.first, errs = [];
  const start = addDays(t, first ? -90 : -7);
  try{
    await gToken();
    try{ // Tageswerte: Schritte & Kalorien
      const rows = arr(await gGet('/usersummary-service/v2/dailysummaries', {startDate:start, endDate:t}));
      rows.forEach(d => { const ds = d.calendarDate; if(!ds) return; S.g.days[ds] = {steps:dig(d, 'movement', 'steps', 'value') ?? null, stepGoal:dig(d, 'movement', 'steps', 'goal') ?? null, dist:dig(d, 'movement', 'steps', 'distanceInMeters') ?? null, total:dig(d, 'calories', 'burnedTotal') ?? null, active:dig(d, 'calories', 'burnedActive') ?? null, resting:dig(d, 'calories', 'burnedResting') ?? null, rhr:dig(d, 'heartRate', 'restingValue') ?? null, stress:dig(d, 'stress', 'avgLevel') ?? null, bbMax:dig(d, 'bodyBattery', 'maxValue') ?? null, bbMin:dig(d, 'bodyBattery', 'minValue') ?? null, im:(dig(d, 'intensityMinutes', 'moderate') || 0) + 2 * (dig(d, 'intensityMinutes', 'vigorous') || 0)}; });
    }catch(e){ errs.push('Tageswerte'); }
    try{ // Schlaf (max. 31 Tage pro Abfrage)
      const ss = first ? addDays(t, -30) : addDays(t, -7);
      arr(await gGet('/sleep-service/sleep/dailySleepSummariesByDate', {startDate:ss, endDate:t})).forEach(n => { if(n.calendarDate && n.sleepTimeSeconds) S.g.sleep[n.calendarDate] = {sec:n.sleepTimeSeconds, deep:n.deepSleepSeconds, rem:n.remSleepSeconds, score:dig(n, 'sleepScores', 'overall', 'value') ?? null}; });
    }catch(e){ errs.push('Schlaf'); }
    try{ // Gewicht (z. B. von einer Garmin-Waage)
      const ws = arr(await gGet(`/weight-service/weight/all/${addDays(t, first ? -365 : -30)}/${t}`));
      let n = 0;
      ws.forEach(x => { let w = x.weight; if(!w) return; if(w > 500) w = w / 1000; const ds = x.calendarDate || (x.date ? ymd(new Date(x.date)) : null); if(!ds) return; const id = 'g' + (x.samplePk || ds + '-' + w); if(S.weights.some(y => y.id === id)) return; S.weights.push({id, date:ds, kg:r1(w), fat:x.bodyFat || null, src:'garmin', ts:x.date || 0}); n++; });

    try{ // Aktivitäten

      const m = new Map(S.g.acts.map(a => [a.id, a]));

      S.g.acts = [...m.values()].sort((a, b) => String(b.start).localeCompare(String(a.start))).slice(0, 150);
    }catch(e){ errs.push('Aktivitäten'); }
    S.g.first = false; S.g.last = Date.now(); S.g.err = errs.length === 4 ? 'Abgleich fehlgeschlagen – später nochmal probieren.' : '';
    saveG(); renderAll(); badgeCheck();
    if(manual) toast(errs.length ? `⌚ Abgeglichen (ohne ${errs.join(', ')})` : '⌚ Garmin abgeglichen');
  }catch(e){
    S.g.err = e.message || String(e); saveG(); renderAll();
    if(manual) toast(S.g.err);
  }
  _gBusy = false;
}

/* ================= Auswertung ================= */
function renderStat(){

  const balance = logged.reduce((s, ds) => s + dayTotals(ds).kcal - kcalGoal(ds), 0);
  const label = ds => n <= 7 ? WD[parse(ds).getDay()] : n <= 31 ? (parse(ds).getDate() % 5 === 1 || ds === t ? parse(ds).getDate() + '.' : '') : (parse(ds).getDate() === 1 ? MSHORT[parse(ds).getMonth()] : '');
  const bars = days.map(ds => { const k = dayTotals(ds).kcal, g = kcalGoal(ds); return {v:k, l:label(ds), cur:ds === t, cls:!k ? '' : k > g * 1.05 ? 'over' : 'ok'}; });

async function yzLogin(email, pw){

      if(r.status === 400 || r.status === 401){ const j = await r.json().catch(() => ({})); if(j.error === 'invalid_grant') throw new Error('E-Mail oder Passwort falsch'); continue; }

const YZ_DAYTIME = {breakfast:'breakfast', lunch:'lunch', dinner:'dinner', snack:'snack'};
const yzN = (n, k) => +(n && n[k]) || 0;

async function yzImport(from, to, onProg){
  const prodCache = {}, days = []; for(let d = from; d <= to; d = addDays(d, 1)) days.push(d);
  let nEntries = 0, nWeights = 0, done = 0;
  const have = new Set(S.log.map(e => e.id));
  const getProd = async id => { if(prodCache[id] !== undefined) return prodCache[id]; let p = null; try{ p = await yzGet('/products/' + id); }catch(e){ p = null; } prodCache[id] = p; return p; };
  const doDay = async ds => {
    const res = await yzGet('/user/consumed-items?date=' + ds);
    const products = Array.isArray(res) ? res : (res && res.products) || [], simple = (res && res.simple_products) || [], recipes = (res && res.recipe_portions) || [];
    const sums = {};
    for(const it of products){
      const id = 'yz' + it.id; const meal = YZ_DAYTIME[it.daytime] || 'snack';
      const p = await getProd(it.product_id); if(!p || !p.nutrients) continue;
      const per100 = yzPer100(p.nutrients), g = +it.amount || 0, n = calcEntry({per100}, g);
      sums[meal] = (sums[meal] || 0) + n.kcal;
      const fid = 'yz:' + it.product_id;
      if(!S.foods[fid]){ const sv = (p.servings || [])[0]; S.foods[fid] = {id:fid, name:p.name, brand:p.producer || '', per100, serving:sv && sv.amount ? {g:sv.amount, label:'1 ' + String(sv.serving || 'Portion').replace(/^\w/, c => c.toUpperCase())} : null, unit:p.base_unit === 'ml' ? 'ml' : 'g', code:(p.eans || [])[0] || null, src:'yazio', uses:0, last:parse(ds).getTime()}; }
      else S.foods[fid].last = Math.max(S.foods[fid].last || 0, parse(ds).getTime());
      S.foods[fid].uses = (S.foods[fid].uses || 0) + 1;
      if(have.has(id)) continue;
      const portions = it.serving_quantity && it.serving && it.serving !== 'g' && it.serving !== 'ml' ? +it.serving_quantity : null;
      S.log.push({id, date:ds, ts:parse(ds).getTime(), src:'yazio', name:p.name + (p.producer ? ` (${p.producer})` : ''), meal, grams:r1(g), unit:p.base_unit === 'ml' ? 'ml' : 'g', portions, serving:portions ? {g:g / portions, label:'1 ' + it.serving} : null, kcal:r1(n.kcal), p:r1(n.p), c:r1(n.c), f:r1(n.f), food:{id:fid, name:p.name, brand:p.producer || '', per100, serving:S.foods[fid].serving, unit:S.foods[fid].unit}});
      have.add(id); nEntries++;
    }
    for(const it of simple){
      const id = 'yz' + it.id, meal = YZ_DAYTIME[it.daytime] || 'snack', nu = it.nutrients || {};
      sums[meal] = (sums[meal] || 0) + yzN(nu, 'energy.energy');
      if(have.has(id)) continue;
      S.log.push({id, date:ds, ts:parse(ds).getTime(), src:'yazio', quick:true, name:it.name || 'Eintrag aus Yazio', meal, kcal:r1(yzN(nu, 'energy.energy')), p:r1(yzN(nu, 'nutrient.protein')), c:r1(yzN(nu, 'nutrient.carb')), f:r1(yzN(nu, 'nutrient.fat'))});
      have.add(id); nEntries++;
    }
    if(recipes.length){ // Rezepte: Rest-Kalorien aus der Tageszusammenfassung übernehmen
      try{
        const sum = await yzGet('/user/widgets/daily-summary?date=' + ds);
        const meals = (sum && sum.meals) || {};
        for(const [dt, m] of Object.entries(meals)){
          const meal = YZ_DAYTIME[dt] || 'snack', nu = (m && m.nutrients) || {}, rest = yzN(nu, 'energy.energy') - (sums[meal] || 0), id = `yzr-${ds}-${meal}`;
          if(rest > 5 && !have.has(id)){ S.log.push({id, date:ds, ts:parse(ds).getTime(), src:'yazio', quick:true, name:'Rezept(e) aus Yazio', meal, kcal:r0(rest), p:0, c:0, f:0}); have.add(id); nEntries++; }
        }
      }catch(e){}
    }
  };
  // Tage parallel abarbeiten (3 gleichzeitig)
  let idx = 0;

  try{
    const seen = new Set(S.weights.map(w => w.id));

/* ================= Gewichts-Trend & lernendes Kalorienziel ================= */
function weightTrend(){
  const out = []; let tr = null, last = null;
  for(const w of S.weights){ if(tr == null) tr = w.kg; else{ const gap = Math.max(1, daysBetween(last, w.date)); tr = tr + (1 - Math.pow(0.9, gap)) * (w.kg - tr); } last = w.date; out.push({date:w.date, kg:w.kg, tr}); }
  return out;
}
function trendInfo(){
  const tr = weightTrend(); if(!tr.length) return null;
  const now = tr[tr.length - 1], ref = [...tr].reverse().find(x => x.date <= addDays(now.date, -14)) || tr[0];
  const d = daysBetween(ref.date, now.date);
  return {tr:now.tr, first:tr[0].tr, rate:d >= 7 ? (now.tr - ref.tr) / d * 7 : null};
}
let _learn = null, _learnKey = '';
function learned(){
  const key = S._v + '|' + S.weights.length + '|' + todayStr();
  if(_learn && _learnKey === key) return _learn;
  const t = todayStr(), end = addDays(t, -1), start = addDays(t, -28), days = [];
  for(let d = start; d <= end; d = addDays(d, 1)) if(entriesOf(d).length) days.push(d);
  const tr = weightTrend().filter(x => x.date >= start && x.date <= end);
  const span = tr.length > 1 ? daysBetween(tr[0].date, tr[tr.length - 1].date) : 0;
  let res = {ok:false, days:days.length, span};
  if(days.length >= 10 && span >= 10){
    const intake = days.reduce((s, d) => s + dayTotals(d).kcal, 0) / days.length;
    const tdee = intake - (tr[tr.length - 1].tr - tr[0].tr) * 7700 / span;
    res = {ok:tdee > 1200 && tdee < 5000, tdee:Math.round(tdee), intake:Math.round(intake), days:days.length, span};
  }
  _learnKey = key; _learn = res; return res;
}
const adaptiveOn = () => !!(S.prof && S.prof.adaptive && !S.prof.manualKcal && learned().ok);

/* ================= Schnell per Text oder Sprache ================= */
const NUMW = {ein:1, eine:1, einen:1, einem:1, zwei:2, drei:3, vier:4, 'fünf':5, fuenf:5, sechs:6, halb:0.5, halbe:0.5, halben:0.5, halber:0.5, '½':0.5, viertel:0.25};
const UNITS = [[/^(kg|kilo)$/, 'g', 1000], [/^(g|gr|gramm)$/, 'g', 1], [/^(ml|milliliter)$/, 'g', 1], [/^(l|liter)$/, 'g', 1000], [/^(el|esslöffel|essloeffel)$/, 'x', 15], [/^(tl|teelöffel|teeloeffel)$/, 'x', 5], [/^(glas|gläser|glaeser)$/, 'x', 200], [/^(tasse|tassen)$/, 'x', 200], [/^(becher)$/, 'x', 150], [/^(dose|dosen)$/, 'x', 330], [/^(flasche|flaschen)$/, 'x', 500], [/^(scheibe|scheiben)$/, 's', 30], [/^(handvoll)$/, 'x', 30], [/^(stück|stueck|stk|st)$/, 's', 100], [/^(portion|portionen|teller|schüssel|schale)$/, 's', 250]];
const normTxt = s => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const stemW = w => w.length >= 4 ? w.replace(/(innen|en|er|n|e|s)$/, '') : w;
function parseItem(raw){
  let s = raw.trim().replace(/^[-•*]\s*/, ''); if(!s) return null;
  let qty = null, unit = null, rest = s;
  const m = s.match(/^(\d+(?:[.,]\d+)?)\s*([a-zäöüß]+\.?)?\s*(.*)$/i);
  if(m){ qty = parseFloat(m[1].replace(',', '.')); const u = (m[2] || '').toLowerCase().replace('.', ''); const U = UNITS.find(([re]) => re.test(u)); if(U){ unit = U; rest = m[3]; } else rest = ((m[2] || '') + ' ' + m[3]).trim(); }
  else{ const w = s.split(/\s+/), n = NUMW[w[0].toLowerCase()]; if(n){ qty = n; w.shift(); const U = UNITS.find(([re]) => re.test((w[0] || '').toLowerCase())); if(U){ unit = U; w.shift(); } rest = w.join(' '); } }
  rest = rest.replace(/^(x|mal)\s+/i, '').replace(/[.!?]+$/, '').trim();
  return rest ? {raw:s, qty, unit, term:rest} : null;
}
function gramsFor(it, food){
  const sv = food.serving && food.serving.g;
  if(it.unit){ const [, kind, f] = it.unit; if(kind === 'g') return (it.qty || 1) * f; if(kind === 's') return (it.qty || 1) * (sv || f); return (it.qty || 1) * f; }
  if(it.qty != null) return it.qty >= 20 ? it.qty : it.qty * (sv || 100);
  return sv || 100;
}
function matchFood(term){
  const toks = normTxt(term).split(' ').filter(w => w.length > 1).map(stemW); if(!toks.length) return null;
  const nt = normTxt(term); let best = null, bs = 0;
  for(const f of allLocalFoods()){
    const h = normTxt(f.name + ' ' + (f.brand || '')), hits = toks.filter(t => h.includes(t)).length; if(!hits) continue;
    const words = h.split(' '), edge = toks.filter(t => words.some(w => w.startsWith(t) || w.endsWith(t))).length;
    const sc = hits / toks.length * 10 + edge / toks.length * 2 - Math.abs(normTxt(f.name).length - nt.length) * 0.05 + (f.fav ? 1 : 0) + Math.min(2, (f.uses || 0) * 0.2) + (h.startsWith(toks[0]) ? 1 : 0);
    if(sc > bs){ bs = sc; best = f; }
  }
  return bs >= 6 ? best : null;
}

/* ================= Nährwert-Etikett per Foto (ML Kit auf dem Handy) ================= */
function parseLabel(r){
  const L = ((r && r.lines) || []).map(l => ({t:l.text || '', x:l.x || 0, y:l.y || 0, h:l.h || 0, cy:(l.y || 0) + (l.h || 0) / 2}));
  if(!L.length && r && r.text) r.text.split('\n').forEach((t, i) => L.push({t, x:0, y:i * 10, h:0, cy:i * 10}));
  const nums = s => [...String(s).replace(/(\d)\s*,\s*(\d)/g, '$1,$2').replace(/[oO](?=[,.]\d)/g, '0').matchAll(/(\d+(?:[.,]\d+)?)\s*(kcal|kj|mg|g)?/gi)].map(m => ({v:parseFloat(m[1].replace(',', '.')), u:(m[2] || '').toLowerCase()}));
  const find = re => {
    for(const l of L){
      const i = l.t.search(re); if(i < 0) continue;
      let ns = nums(l.t.slice(i).replace(re, ''));
      if(!ns.length && l.h){ const row = L.filter(o => o !== l && Math.abs(o.cy - l.cy) < l.h * 0.7 && o.x > l.x).sort((a, b) => a.x - b.x); for(const o of row){ ns = nums(o.t); if(ns.length) break; } }
      if(ns.length) return ns[0].u === 'mg' ? ns[0].v / 1000 : ns[0].v;
    }
    return null;
  };
  const all = L.map(l => l.t).join('\n');
  let kcal = null; const mk = all.replace(/(\d)\s*,\s*(\d)/g, '$1,$2').match(/(\d+(?:[.,]\d+)?)\s*kcal/i);
  if(mk) kcal = parseFloat(mk[1].replace(',', '.'));
  else{ const mj = all.match(/(\d+(?:[.,]\d+)?)\s*kj/i); if(mj) kcal = Math.round(parseFloat(mj[1].replace(',', '.')) / 4.184); }
  return {kcal, f:find(/^\s*(fett|fat|lipides)\b(?!\s*s)/i), c:find(/kohlenhydrat|carbohydrate|glucides/i), sugar:find(/zucker|sugars?\b|sucres/i), fiber:find(/ballaststoff|fibre|fiber/i), p:find(/eiwei|protein/i), salt:find(/^\s*(salz|salt|sel)\b/i)};
}

    <div class="scanbox" style="aspect-ratio:3/4"><video id="lb-v" playsinline muted autoplay></video></div>

/* Bild auswählen/aufnehmen und verkleinern */
function pickImage(camera, maxSide, q){
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; if(camera) inp.setAttribute('capture', 'environment');
    inp.onchange = () => { const f = inp.files && inp.files[0]; if(!f){ res(null); return; } const rd = new FileReader(); rd.onload = () => scaleImage(rd.result, maxSide, q).then(res); rd.onerror = () => res(null); rd.readAsDataURL(f); };
    inp.click();
  });
}
function scaleImage(src, maxSide, q){
  return new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, maxSide / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.onerror = () => res(null); img.src = src; });
}

/* ================= Intervallfasten ================= */
const FAST_PLANS = [[14, '14:10'], [16, '16:8'], [18, '18:6'], [20, '20:4'], [24, '24 h']];
const planName = h => (FAST_PLANS.find(p => p[0] === h) || [h, h + ' h'])[1];
const hm = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 3600)}:${pad2(Math.floor(sec % 3600 / 60))} h`; };
function renderFastCard(){
  const el = $('#fastcard'); if(!el) return;
  const f = S.fast.active, plan = S.fast.plan || 16, last = S.fast.hist[S.fast.hist.length - 1];
  if(!f){
    el.innerHTML = `<div class="card"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:26px">⏱️</div><div style="flex:1;min-width:0"><b>Intervallfasten</b><div class="muted">Plan ${planName(plan)}${last ? ` · zuletzt ${hm(last.sec)}${last.ok ? ' ✓' : ''}` : ''}</div></div><button class="chip" id="fa-set">⚙️</button><button class="chip on" id="fa-go">Starten</button></div></div>`;
    $('#fa-go').onclick = () => { S.fast.active = {start:Date.now(), h:plan}; saveFast(); renderFastCard(); toast(`⏱️ Fasten gestartet – Ziel ${plan} Stunden`); };
    $('#fa-set').onclick = fastSheet; return;
  }
  const sec = (Date.now() - f.start) / 1000, goal = f.h * 3600, p = Math.min(1, sec / goal), end = new Date(f.start + goal * 1000), ok = sec >= goal;
  el.innerHTML = `<div class="card"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:26px">${ok ? '🎉' : '⏱️'}</div><div style="flex:1;min-width:0"><b>${ok ? 'Fasten-Ziel geschafft!' : `Du fastest seit ${hm(sec)}`}</b><div class="muted">${ok ? `${hm(sec)} – Ziel war ${f.h} h` : `noch ${hm(goal - sec)} · Ende ${end.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})} Uhr${end.getDate() !== new Date().getDate() ? ' (morgen)' : ''}`}</div></div><button class="chip" id="fa-set">⚙️</button><button class="chip ${ok ? 'on' : ''}" id="fa-end">Beenden</button></div>
    <div class="prog" style="height:10px;margin-top:10px"><i class="${ok ? '' : ''}" style="width:${p * 100}%;${ok ? 'background:linear-gradient(90deg,#8ff0b8,#3fd68a)' : ''}"></i></div></div>`;
  $('#fa-set').onclick = fastSheet;
  $('#fa-end').onclick = () => { if(!ok && !confirmTwice('#fa-end')) return; endFast(); };
}
function endFast(){ const f = S.fast.active; if(!f) return; const sec = (Date.now() - f.start) / 1000; S.fast.hist.push({start:f.start, end:Date.now(), h:f.h, sec, ok:sec >= f.h * 3600}); S.fast.hist = S.fast.hist.slice(-200); S.fast.active = null; saveFast(); renderAll(); toast(sec >= f.h * 3600 ? `🎉 ${hm(sec)} gefastet – stark!` : `Fasten beendet nach ${hm(sec)}`); badgeCheck(); }

const _ft = {};
function feiertage(y){ // gesetzliche Feiertage NRW
  if(_ft[y]) return _ft[y];
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  const os = ymd(new Date(y, mo - 1, da));
  return _ft[y] = new Map([[`${y}-01-01`, 'Neujahr'], [addDays(os, -2), 'Karfreitag'], [os, 'Ostersonntag'], [addDays(os, 1), 'Ostermontag'], [`${y}-05-01`, 'Tag der Arbeit'], [addDays(os, 39), 'Christi Himmelfahrt'], [addDays(os, 49), 'Pfingstsonntag'], [addDays(os, 50), 'Pfingstmontag'], [addDays(os, 60), 'Fronleichnam'], [`${y}-10-03`, 'Tag der Deutschen Einheit'], [`${y}-11-01`, 'Allerheiligen'], [`${y}-12-25`, '1. Weihnachtstag'], [`${y}-12-26`, '2. Weihnachtstag']]);
}
const DRINK_RE = /cola|fanta|sprite|limo|mezzo|spezi|saft|schorle|nektar|eistee|ice ?tea|energy|red ?bull|monster|\bbier|radler|\bwein\b|rotwein|weißwein|weisswein|ros[ée]\b|sekt|prosecco|smoothie|milchshake|cocktail|brause|aperol/i;
function chExempt(ds){
  const c = S.ch, ft = feiertage(+ds.slice(0, 4)).get(ds); if(ft) return ft;
  const ddmm = ds.slice(8, 10) + '.' + ds.slice(5, 7);
  const bd = (c.bdays || '').split(/[,;\n]+/).map(x => x.trim()).filter(Boolean).find(x => { const m = x.match(/(\d{1,2})\.(\d{1,2})/); return m && pad2(+m[1]) + '.' + pad2(+m[2]) === ddmm; });
  if(bd) return 'Geburtstag' + (bd.replace(/[\d.\s]+/, '').trim() ? ' ' + bd.replace(/[\d.\s]+/, '').trim() : '');

}

const inGoal = ds => { const k = dayTotals(ds).kcal, g = kcalGoal(ds); return k >= g * 0.75 && k <= g * 1.05; };
function runs(dates, test){ // aktuelle und beste Serie aufeinanderfolgender Tage
  const sorted = [...new Set(dates)].sort(); let best = 0, cur = 0, prev = null;
  for(const d of sorted){ if(test && !test(d)){ cur = 0; prev = d; continue; } cur = prev && daysBetween(prev, d) === 1 && cur > 0 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }
  return best;
}
function streaks(){
  const t = todayStr(), days = new Set(S.log.map(e => e.date)), wg = waterGoal();
  let d = days.has(t) ? t : addDays(t, -1), log = 0; while(days.has(d)){ log++; d = addDays(d, -1); }
  let g = days.has(t) && inGoal(t) ? t : addDays(t, -1), goal = 0; while(days.has(g) && inGoal(g)){ goal++; g = addDays(g, -1); }
  let w = (S.water[t] || 0) >= wg ? t : addDays(t, -1), water = 0; while((S.water[w] || 0) >= wg){ water++; w = addDays(w, -1); }
  return {log, goal, water};
}

  if(c.on && !c.lost && t >= c.start && t <= c.date && !chExempt(t) && names.some(n => DRINK_RE.test(n) && !/wasser/i.test(n))) setTimeout(() => toast('🤘 Achtung, Nur-Wasser-Challenge! Schau ins Tagebuch.'), 2700);
}
function formulaTdee(){
  const p = S.prof; if(!p) return 0; const t = todayStr(); let act = 0;
  if(gActive()){ let n = 0; for(let i = 1; i <= 28; i++){ const d = S.g.days[addDays(t, -i)]; if(d && d.active != null){ act += d.active; n++; } } act = n ? act / n : 0; }
  else{ for(let i = 1; i <= 28; i++) act += manualKcal(addDays(t, -i)); act /= 28; }
  return Math.round(bmr() * (gActive() ? 1.2 : (ACT[p.activity] || ACT.light)[2]) + act);
}

/* ================= Sicherung ================= */
const BK_DIR = 'Fitness-Multiversum';
const backupJSON = () => JSON.stringify({app:'Fitness-Multiversum', v:1, date:new Date().toISOString(), cfg:S.cfg, prof:S.prof, log:S.log, foods:S.foods, weights:S.weights, water:S.water, sport:S.sport, fast:S.fast, measures:S.measures, ch:S.ch, badges:S.badges, garmin:{days:S.g.days, sleep:S.g.sleep, acts:S.g.acts}});
function importBackup(text){
  try{
    const d = JSON.parse(text); if(d.app !== 'Fitness-Multiversum') throw 0;
    const merge = (mine, theirs) => { const m = new Map(mine.map(x => [x.id, x])); let n = 0; (theirs || []).forEach(x => { if(!m.has(x.id)){ n++; m.set(x.id, x); } }); return [[...m.values()], n]; };
    let n1; [S.log, n1] = merge(S.log, d.log); [S.weights] = merge(S.weights, d.weights); [S.sport] = merge(S.sport, d.sport); [S.measures] = merge(S.measures, d.measures);
    if(d.fast && !S.fast.hist.length) S.fast.hist = d.fast.hist || []; if(d.ch && !S.ch.on) S.ch = Object.assign(S.ch, d.ch); S.badges = Object.assign({}, d.badges || {}, S.badges);
    store('fx_sport', S.sport); store('fx_meas', S.measures); store('fx_fast', S.fast); store('fx_ch', S.ch); store('fx_badges', S.badges);
    S.foods = Object.assign({}, d.foods || {}, S.foods); S.water = Object.assign({}, d.water || {}, S.water);
    if(d.garmin){ S.g.days = Object.assign({}, d.garmin.days || {}, S.g.days); S.g.sleep = Object.assign({}, d.garmin.sleep || {}, S.g.sleep); if(!S.g.acts.length) S.g.acts = d.garmin.acts || []; saveG(); }
    if(d.prof && !S.prof) S.prof = d.prof;
    if(d.cfg && !S.cfg.name) S.cfg = Object.assign(S.cfg, d.cfg, {notify:S.cfg.notify});
    saveLog(); saveWeights(); saveWater(); saveProf(); saveCfg(); closeSheet(); renderAll();
    toast(`Eingefügt: ${n1} Einträge`);
  }catch(e){ toast('Das ist keine gültige Sicherung'); }
}
let _bkT;
function autoBackup(){ if(!NATIVE) return; clearTimeout(_bkT); _bkT = setTimeout(() => writeBackup(false), 3000); }
async function writeBackup(manual){
  const FS = plug('Filesystem');
  if(!FS){ if(manual){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupJSON()], {type:'application/json'})); a.download = `fitness-multiversum-${todayStr()}.json`; a.click(); } return; }
  try{
    try{ const p = await FS.checkPermissions(); if(p.publicStorage !== 'granted') await FS.requestPermissions(); }catch(e){}
    await FS.writeFile({path:`${BK_DIR}/sicherung-${todayStr()}.json`, data:backupJSON(), directory:'DOCUMENTS', encoding:'utf8', recursive:true});
    store('fx_lastbk', Date.now()); renderBackupInfo();
    try{
      const r = await FS.readdir({path:BK_DIR, directory:'DOCUMENTS'});
      const files = (r.files || []).map(f => typeof f === 'string' ? f : f.name).filter(n => /^sicherung-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort();
      for(const n of files.slice(0, Math.max(0, files.length - 7))) await FS.deleteFile({path:`${BK_DIR}/${n}`, directory:'DOCUMENTS'}).catch(() => {});
    }catch(e){}
    if(manual) toast('💾 Gesichert in Dokumente/Fitness-Multiversum');
  }catch(e){ if(manual) toast('Sicherung fehlgeschlagen: ' + (e.message || e)); }
}
function renderBackupInfo(){
  const el = $('#s-bk'); if(!el) return;
  const t = store('fx_lastbk');
  el.textContent = !NATIVE ? 'Im Browser: „Jetzt sichern“ lädt eine Datei herunter.' : t ? `Automatisch täglich · zuletzt ${new Date(t).toLocaleString('de-DE', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})} Uhr` : 'Noch keine Sicherung';
}

/* ================= App-Updates (wie bei TCG Multiversum) ================= */
async function checkUpdate(manual){
  if(!APP_BUILD && !manual) return;
  try{
    let r;
    try{ r = await fetch(UPDATE_INFO + '?t=' + Date.now(), {cache:'no-store'}); }
    catch(e){ if(manual) toast('Keine Verbindung – bist du online?'); return; }
    if(!r.ok){ if(manual) toast(r.status === 404 ? 'Update-Info nicht gefunden – ist das GitHub-Repo öffentlich?' : `Update-Server antwortet nicht (Fehler ${r.status})`); return; }
    const v = await r.json(), build = parseInt(v.build, 10);
    S.update = (build > APP_BUILD && v.apk) ? {build, url:v.apk, notes:v.notes || '', size:v.size} : null;
    renderUpdateInfo();
    if(S.update){ if(manual || store('fx_upd_skip') !== build) showUpdateSheet(); }
    else if(manual) toast('Du hast die neueste Version');
  }catch(e){ if(manual) toast('Update-Info ist fehlerhaft'); }
}
function renderUpdateInfo(){ const el = $('#upd-info'); if(!el) return; el.innerHTML = `Version 1.${APP_BUILD || '–'}` + (S.update ? ` · <b style="color:var(--acc)">1.${S.update.build} verfügbar</b>` : ''); }
function showUpdateSheet(){
  const u = S.update; if(!u) return;
  const notes = u.notes.replace(/\r/g, '').replace(/^#+\s*/gm, '').replace(/\*\*/g, '').trim();
  openSheet(`<h2 style="margin:0 0 4px">Neue Version 1.${u.build}</h2>
    <p class="muted" style="margin:0 0 10px">Du hast 1.${APP_BUILD}.${u.size ? ` Download ca. ${(u.size / 1048576).toLocaleString('de-DE', {maximumFractionDigits:1})} MB.` : ''}</p>
    ${notes ? `<div style="white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px">${esc(notes)}</div>` : ''}
    <div class="btns"><button class="btn pri" id="u-go">Jetzt aktualisieren</button><button class="btn" id="u-later">Später</button></div>
    <p class="muted" style="font-size:12px;margin-top:10px">Die neue APK wird im Browser geladen. Danach auf die Datei tippen und „Installieren“ wählen. Deine Daten bleiben erhalten.</p>`);
  $('#u-go').onclick = () => openUrl(u.url);
  $('#u-later').onclick = () => { store('fx_upd_skip', u.build); closeSheet(); };
}

/* ================= Erinnerungen ================= */
const hashId = str => { let h = 0; for(let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) % 2000000000 + 1; };
let _schedT;
function scheduleReminders(){ if(!NATIVE) return; clearTimeout(_schedT); _schedT = setTimeout(doSchedule, 800); }
const atTime = (ds, hhmm) => { const d = parse(ds); const [h, m] = (hhmm || '09:00').split(':').map(Number); d.setHours(h, m, 0, 0); return d; };
async function doSchedule(){
  const LN = plug('LocalNotifications'); if(!LN) return;
  try{
    const pend = await LN.getPending();
    if(pend.notifications && pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n => ({id:n.id}))});
    if(!S.cfg.notify) return;
    const perm = await LN.checkPermissions(); if(perm.display !== 'granted') return;
    const now = Date.now(), t = todayStr(), list = [];
    const TXT = {breakfast:['☕ Frühstück eintragen?', 'Kurz eintragen, was du gefrühstückt hast.'], lunch:['🍝 Mittagessen eintragen?', 'Was gab es heute Mittag?'], dinner:['🍲 Abendessen eintragen?', 'Abendessen nicht vergessen – dann stimmt die Tagesbilanz.']};
    for(let i = 0; i < 10; i++){
      const ds = addDays(t, i);
      if(S.cfg.mealRemind) Object.entries(S.cfg.mealTimes).forEach(([m, hhmm]) => { if(i === 0 && entriesOf(ds).some(e => e.meal === m)) return; const at = atTime(ds, hhmm); if(at > now) list.push({id:hashId('meal' + m + ds), title:TXT[m][0], body:TXT[m][1], schedule:{at, allowWhileIdle:true}}); });
      if(S.cfg.weighRemind){ if(i === 0 && S.weights.some(w => w.date === ds)) continue; const at = atTime(ds, S.cfg.weighAt); if(at > now) list.push({id:hashId('weigh' + ds), title:'⚖️ Guten Morgen!', body:'Zeit fürs Wiegen – am besten vor dem Frühstück.', schedule:{at, allowWhileIdle:true}}); }
    }
    if(S.fast.active){ const at = new Date(S.fast.active.start + S.fast.active.h * 3600e3); if(at > now) list.push({id:hashId('fast' + S.fast.active.start), title:'⏱️ Fasten-Ziel geschafft!', body:`${S.fast.active.h} Stunden – du darfst wieder essen 🎉`, schedule:{at, allowWhileIdle:true}}); }
    if(S.cfg.waterRemind){ for(let i = 0; i < 5; i++){ const ds = addDays(t, i); if(i === 0 && (S.water[ds] || 0) >= waterGoal()) continue; [10, 12, 14, 16, 18, 20].forEach(hh => { const at = atTime(ds, pad2(hh) + ':00'); if(at > now) list.push({id:hashId('water' + ds + hh), title:'💧 Zeit für ein Glas Wasser', body:i === 0 ? `Bisher ${de((S.water[ds] || 0) / 1000, 2)} von ${de(waterGoal() / 1000, 1)} l` : 'Ein Glas Wasser zwischendurch 🙂', schedule:{at, allowWhileIdle:true}}); }); } }
    list.sort((a, b) => a.schedule.at - b.schedule.at);
    if(list.length) await LN.schedule({notifications:list.slice(0, 60)});
  }catch(e){ console.log('Erinnerungen:', e); }
}
async function askNotify(force){
  const LN = plug('LocalNotifications'); if(!LN) return;
  try{ let p = await LN.checkPermissions(); if(p.display !== 'granted' && (force || !store('fx_asked'))){ store('fx_asked', 1); p = await LN.requestPermissions(); } }catch(e){}
  scheduleReminders();
}
async function renderNotifyInfo(){
  const el = $('#s-notinfo'); if(!el) return;
  if(!NATIVE){ el.textContent = 'nur in der Android-App'; return; }
  try{ const p = await plug('LocalNotifications').checkPermissions(); el.textContent = !S.cfg.notify ? 'aus' : p.display === 'granted' ? 'aktiv' : 'Bitte Benachrichtigungen erlauben (Android-Einstellungen)'; }catch(e){ el.textContent = ''; }
}
if(NATIVE){ try{ plug('LocalNotifications').addListener('localNotificationActionPerformed', () => { closeSheet(); S.day = todayStr(); showView('home'); }); }catch(e){} }

S.day = todayStr();
showView('home');
if(!S.prof) setTimeout(goalSheet, 500);
badgeCheck();
if(NATIVE){ askNotify(false); scheduleReminders(); setTimeout(() => checkUpdate(false), 1500); if(gActive() && Date.now() - (S.g.last || 0) > 30 * 60e3) setTimeout(() => garminSync(false), 1200); if(!store('fx_lastbk') || Date.now() - store('fx_lastbk') > 864e5) setTimeout(() => writeBackup(false), 4000); }
</script>
